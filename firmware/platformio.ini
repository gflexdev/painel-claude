; Display de bancada do painel-claude.
;   env:guition  → placa Guition ESP32-4848S040 (ESP32-S3, 480×480 ST7701 + GT911)
;   env:amoled   → Waveshare ESP32-S3-Touch-AMOLED-1.75 (redonda, 466×466 CO5300 + CST9217)
;   env:sim      → simulador no Mac (SDL2), mesma interface e mesmo cliente HTTP/SSE
;   env:sim-round → simulador do mostrador redondo (466×466 com máscara)
;
; Compilar a placa:   pio run -e guition
; Gravar a placa:     pio run -e guition -t upload && pio device monitor -e guition
; Simulador:          pio run -e sim && .pio/build/sim/program

[platformio]
default_envs = guition

[env]
lib_deps =
  lvgl/lvgl@9.5.0
  bblanchon/ArduinoJson@7.4.3
build_flags =
  -I include
  -I src
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D ARDUINOJSON_ENABLE_STD_STRING=1

[env:guition]
; pioarduino = Arduino-ESP32 3.3 sobre ESP-IDF 5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11 -std=gnu++2b
build_flags =
  ${env.build_flags}
  -std=gnu++17
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D CORE_DEBUG_LEVEL=2
build_src_filter = +<*> -<sim/> -<round/> -<board_amoled/>

[env:amoled]
; Waveshare ESP32-S3-Touch-AMOLED-1.75 (ESP32-S3R8: 8 MB de PSRAM octal, 16 MB de flash). USB nativo.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
  ${env.lib_deps}
  moononournation/GFX Library for Arduino@1.6.9
  lewisxhe/SensorLib@0.5.2
build_unflags = -std=gnu++11 -std=gnu++2b
build_flags =
  ${env.build_flags}
  -std=gnu++17
  -D BOARD_HAS_PSRAM
  -D PAINEL_ROUND=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=2
build_src_filter = +<*> -<sim/> -<board/>

[env:sim]
platform = native
build_flags =
  ${env.build_flags}
  -std=c++17
  -D PAINEL_SIM=1
  -D LV_USE_SDL=1
  !sdl2-config --cflags
  !sdl2-config --libs
  -Wno-deprecated-declarations
build_src_filter = +<*> -<board/> -<esp32/> -<board_amoled/>

[env:sim-round]
extends = env:sim
build_flags =
  ${env:sim.build_flags}
  -D PAINEL_ROUND=1
